<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      color: #202124;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ---------- Barra superior ---------- */
    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 15px;
      padding: 6px 16px;
      height: 60px;
      font-size: 13px;
    }

    .apps {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .apps:hover { background: #f1f3f4; }

    .btn-login {
      background: #1a73e8;
      color: #fff;
      padding: 9px 23px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
    }
    .btn-login:hover { background: #1b66c9; text-decoration: none; }

    /* ---------- Centro ---------- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px;
      margin-top: 12vh;
    }

    /* Logo de texto propio: cámbialo por tu imagen o nombre */
    .logo {
      font-size: 72px;
      font-weight: bold;
      letter-spacing: -2px;
      margin-bottom: 28px;
      user-select: none;
    }
    .logo span:nth-child(1) { color: #6a4cff; }
    .logo span:nth-child(2) { color: #ff6b4a; }
    .logo span:nth-child(3) { color: #2bb673; }

    form {
      width: 100%;
      max-width: 584px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .search-box {
      width: 100%;
      height: 46px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
    }
    .search-box:hover,
    .search-box:focus-within {
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
      border-color: transparent;
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      height: 100%;
      background: transparent;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .buttons button {
      background: #f8f9fa;
      border: 1px solid #f8f9fa;
      border-radius: 4px;
      color: #3c4043;
      font-size: 14px;
      padding: 0 16px;
      height: 36px;
      cursor: pointer;
    }
    .buttons button:hover {
      border-color: #dadce0;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
    }

    .languages {
      margin-top: 28px;
      font-size: 13px;
      color: #4d5156;
    }
    .languages a { color: #1a0dab; margin: 0 3px; }

    /* ---------- Footer ---------- */
    footer {
      background: #f2f2f2;
      font-size: 14px;
      color: #70757a;
    }
    .footer-country {
      padding: 15px 30px;
      border-bottom: 1px solid #dadce0;
    }
    .footer-links {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      padding: 0 20px;
    }
    .footer-links div { display: flex; flex-wrap: wrap; }
    .footer-links a { padding: 15px; }

    @media (max-width: 600px) {
      .logo { font-size: 52px; }
      .footer-links { justify-content: center; }
    }
  </style>
</head>
<body>

  <header>
    <a href="#">Gmail</a>
    <a href="#">Imágenes</a>
    <div class="apps" title="Aplicaciones">
      <!-- Ícono de cuadrícula 3x3 -->
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#5f6368">
        <circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/>
        <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
        <circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/>
      </svg>
    </div>
    <a href="#" class="btn-login">Acceder</a>
  </header>

  <main>
    <div class="logo"><span>Bus</span><span>ca</span><span>dor</span></div>

    <form id="search-form">
      <div class="search-box">
        <!-- Lupa -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="2.5" stroke-linecap="round">
          <circle cx="10" cy="10" r="7"/>
          <line x1="15.5" y1="15.5" x2="21" y2="21"/>
        </svg>
        <input type="text" id="search-input" autocomplete="off" autofocus aria-label="Buscar" />
      </div>

      <div class="buttons">
        <button type="submit">Buscar con Google</button>
        <button type="button" id="lucky-btn">Voy a tener suerte</button>
      </div>
    </form>

    <p class="languages">
      Ofrecido en: <a href="#">English</a>
    </p>
  </main>

  <footer>
    <div class="footer-country">México</div>
    <div class="footer-links">
      <div>
        <a href="#">Sobre nosotros</a>
        <a href="#">Publicidad</a>
        <a href="#">Negocios</a>
        <a href="#">Cómo funciona</a>
      </div>
      <div>
        <a href="#">Privacidad</a>
        <a href="#">Condiciones</a>
        <a href="#">Preferencias</a>
      </div>
    </div>
  </footer>

  <script>
    const form = document.getElementById("search-form");
    const input = document.getElementById("search-input");
    const luckyBtn = document.getElementById("lucky-btn");

    function buscar() {
      const busqueda = input.value.trim();
      if (!busqueda) {      // si está vacío, no hace nada
        input.focus();
        return;
      }
      // encodeURIComponent convierte espacios y símbolos para que la URL sea válida
      window.location.href = `https://google.com/search?q=${encodeURIComponent(busqueda)}`;
    }

    // Enter en el input o click en "Buscar con Google" (dispara el submit del form)
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      buscar();
    });

    // Click en "Voy a tener suerte"
    luckyBtn.addEventListener("click", buscar);
  </script>
</body>
</html>
